<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OSINT Dashboard{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen">
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="/" class="navbar-brand">
                <svg class="navbar-logo" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <span class="navbar-title">OSINT<span>Dashboard</span></span>
            </a>
            <div class="navbar-links">
                <a href="/batch" class="navbar-link">Batch Scan</a>
                <span class="navbar-badge">LAN-ONLY</span>
            </div>
        </div>
    </nav>

    <!-- Flash Messages -->
    {% block flash %}{% endblock %}

    <!-- Main Content -->
    <main class="main-container fade-in">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        OSINT Dashboard v1.0 &middot; Local LAN Deployment &middot; No external exposure
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
